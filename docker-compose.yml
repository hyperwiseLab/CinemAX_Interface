version: '3.8'

services:
  cinemax:
    image: cinemax:latest
    container_name: cinemax-app
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=prod

      # Database Configuration
      - DB_URL=jdbc:mariadb://175.126.37.175:3306/cinemax_dev?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - DB_USERNAME=root
      - DB_PASSWORD=cinemax!2025

      # JWT Configuration
      - JWT_SECRET=your-secret-key-change-this-in-production-minimum-256-bits-required-for-hs256-algorithm
      - JWT_ACCESS_TOKEN_EXPIRATION=10800000
      - JWT_REFRESH_TOKEN_EXPIRATION=604800000
      - JWT_ISSUER=cinemax

      # Email Configuration
      - EMAIL_FROM=iwings_noreply@hyperwise.co.kr
      - EMAIL_FROM_NAME=Cinemax

      # Jenkins Configuration
      - JENKINS_URL=http://localhost:8081
      - JENKINS_USERNAME=admin
      - JENKINS_TOKEN=your-jenkins-api-token
      - JENKINS_CONNECTION_TIMEOUT=30000
      - JENKINS_READ_TIMEOUT=60000

      # Gemini AI Configuration
      # Vertex AI / Gemini 는 서비스 계정(JSON 키) 기반으로 사용
      # 로컬의 ./keys.json 을 컨테이너 /app/keys.json 으로 마운트하고,
      # GOOGLE_APPLICATION_CREDENTIALS 로 해당 경로를 지정합니다.
      - GEMINI_ENABLED=true
      - GEMINI_PROJECT_ID=gen-lang-client-0677787784
      - GEMINI_LOCATION=us-central1
      - GEMINI_MODEL=gemini-2.5-flash
      - GEMINI_TEMPERATURE=0.7
      - GEMINI_MAX_TOKENS=2048
      - GEMINI_TOP_P=0.95
      - GEMINI_TOP_K=40
      - GOOGLE_APPLICATION_CREDENTIALS=/app/keys.json

    restart: unless-stopped
    networks:
      - cinemax-network
    volumes:
      - ./logs:/app/logs
      # 서비스 계정 키 파일 마운트 (호스트 ./keys.json -> 컨테이너 /app/keys.json)
      - ./keys.json:/app/keys.json:ro

networks:
  cinemax-network:
    driver: bridge
