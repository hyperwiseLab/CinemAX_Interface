version: '3.8'

services:
  cinemax:
    image: cinemax:latest
    container_name: cinemax-app
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=prod

      # Database Configuration
      - DB_URL=jdbc:mariadb://175.126.37.175:3306/cinemax_dev?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - DB_USERNAME=root
      - DB_PASSWORD=cinemax!2025

      # JWT Configuration
      - JWT_SECRET=your-secret-key-change-this-in-production-minimum-256-bits-required-for-hs256-algorithm
      - JWT_ACCESS_TOKEN_EXPIRATION=10800000
      - JWT_REFRESH_TOKEN_EXPIRATION=604800000
      - JWT_ISSUER=cinemax

      # Email Configuration
      - EMAIL_FROM=iwings_noreply@hyperwise.co.kr
      - EMAIL_FROM_NAME=Cinemax

      # Jenkins Configuration
      - JENKINS_URL=http://localhost:8081
      - JENKINS_USERNAME=admin
      - JENKINS_TOKEN=your-jenkins-api-token
      - JENKINS_CONNECTION_TIMEOUT=30000
      - JENKINS_READ_TIMEOUT=60000

      # OpenAI Configuration
      # OPENAI_API_KEY 는 커밋 금지 — .env 또는 배포 환경(Jenkins cinemax_ENV_FILE)에서 주입
      - OPENAI_ENABLED=true
      - OPENAI_MODEL=gpt-5-mini
      - OPENAI_TEMPERATURE=0.7
      - OPENAI_MAX_TOKENS=2048
      - OPENAI_TOP_P=0.95
      # - OPENAI_API_KEY=sk-...   # .env 로 주입 (docker compose는 .env를 자동 로드)

    restart: unless-stopped
    networks:
      - cinemax-network
    volumes:
      - ./logs:/app/logs

networks:
  cinemax-network:
    driver: bridge
