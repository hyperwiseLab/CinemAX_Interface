# ====================================
# Application Configuration
# ====================================
spring.application.name=Cinemax
server.port=8080
server.servlet.context-path=/api/v1

# ====================================
# Database Configuration (MariaDB)
# ====================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://175.126.37.175:3306/cinemax_dev?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Database Initialization
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:db/index.sql
#spring.sql.init.continue-on-error=false
#spring.sql.init.separator=;
#spring.sql.init.encoding=UTF-8

# Connection Pool Settings
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ====================================
# JPA Configuration
# ====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ====================================
# MyBatis Configuration
# ====================================
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30
mybatis.type-aliases-package=com.cinemax.*.domain
mybatis.mapper-locations=classpath:mapper/**/*.xml

# ====================================
# Flyway Configuration (Disabled)
# ====================================
spring.flyway.enabled=false

# ====================================
# Redis Configuration
# ====================================
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#spring.data.redis.password=
#spring.data.redis.timeout=60000
#spring.data.redis.lettuce.pool.min-idle=0
#spring.data.redis.lettuce.pool.max-idle=8
#spring.data.redis.lettuce.pool.max-active=8
#spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache Configuration
#spring.cache.type=redis
#spring.cache.redis.time-to-live=3600000
#spring.cache.redis.cache-null-values=false

# ====================================
# JWT Configuration
# ====================================
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-minimum-256-bits-required-for-hs256-algorithm}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:10800000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
jwt.issuer=${JWT_ISSUER:cinemax}

# ====================================
# Security Configuration
# ====================================
spring.security.user.name=admin
spring.security.user.password=admin

# ====================================
# Mail Configuration (SMTP) - Using EmailConfig.java instead
# ====================================
# Replace for EmailConfig.java

# ====================================
# Password Reset Configuration
# ====================================
app.password-reset.expiration-minutes=30
app.password-reset.max-attempts=5
app.password-reset.rate-limit-minutes=5

# ====================================
# Email Configuration
# ====================================
app.email.from=hyperwise98@gmail.com
app.email.from-name=Cinemax

# ====================================
# File Upload Configuration
# ====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# ====================================
# Logging Configuration
# ====================================
logging.level.root=INFO
logging.level.com.cinemax=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/cinemax.log
logging.file.max-size=10MB
logging.file.max-history=30

# ====================================
# Actuator Configuration
# ====================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true

# ====================================
# Batch Configuration
# ====================================
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# ====================================
# API Documentation (Swagger/OpenAPI)
# ====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true

# ====================================
# Jackson Configuration
# ====================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul
spring.jackson.default-property-inclusion=non_null

# ====================================
# Validation Configuration
# ====================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ====================================
# DevTools Configuration (Development Only)
# ====================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ====================================
# Internationalization
# ====================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# ====================================
# Jenkins Configuration
# Note: Actual credentials are loaded from secretKey.json
# ====================================
jenkins.url=${JENKINS_URL:http://localhost:8081}
jenkins.username=${JENKINS_USERNAME:admin}
jenkins.token=${JENKINS_TOKEN:your-jenkins-api-token}
jenkins.connection-timeout=${JENKINS_CONNECTION_TIMEOUT:30000}
jenkins.read-timeout=${JENKINS_READ_TIMEOUT:60000}

# ====================================
# Piston (Code Execution Engine) Configuration
# 셀프호스팅 Piston 인스턴스. 브라우저 직접 호출 시 CORS 문제로 백엔드가 프록시함
# ====================================
piston.url=${PISTON_URL:http://221.148.101.200:2000}
piston.read-timeout=${PISTON_READ_TIMEOUT:30000}

# ====================================
# OpenAI Configuration
# ====================================
openai.enabled=true
openai.api-key=${OPENAI_API_KEY:your-openai-api-key}
openai.model=${OPENAI_MODEL:gpt-5-mini}
openai.temperature=${OPENAI_TEMPERATURE:0.7}
openai.max-tokens=${OPENAI_MAX_TOKENS:8192}
openai.top-p=${OPENAI_TOP_P:0.95}

# OpenAiChatModel Bean은 GeminiConfig에서 수동 생성하므로 스타터 자동설정은 비활성화
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration